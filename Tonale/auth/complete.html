<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b0d12">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Return to Tonale after Xin Account sign-in</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../../assets/xin-account/auth-complete.css">
  <script defer src="../../assets/xin-account/auth-complete.js"></script>
</head>
<body data-callback-url="com.xintechllc.tonale.auth://callback" data-app-name="Tonale">
  <main class="auth-shell" aria-labelledby="auth-title">
    <section class="auth-card">
      <img class="app-icon" src="../assets/tonale-icon-256.png" alt="" width="96" height="96">
      <p class="eyebrow">Xin Account secure sign-in for Tonale</p>
      <div class="status-mark" aria-hidden="true"><span></span></div>
      <h1 id="auth-title">Return to Tonale</h1>
      <p id="auth-message" class="message" aria-live="polite">Your Xin Account sign-in is ready. Select <strong>Open Tonale</strong> to return to Tonale.</p>
      <a id="open-app" class="open-app" href="#" hidden>Open Tonale</a>
      <p id="auth-help" class="help" hidden>If Tonale did not open, <a id="retry-open" href="#">try again</a>.</p>
    </section>
    <p class="privacy-note">Your Xin Account sign-in response is sent only to the Tonale app on this Mac.</p>
  </main>
</body>
</html>
