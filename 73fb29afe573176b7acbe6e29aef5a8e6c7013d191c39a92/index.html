<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Shared screenshots</title>
  <style>
    :root {
      color-scheme: dark;
      background: #090a0d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: clamp(12px, 3vw, 40px);
      background: #090a0d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 1800px);
      margin: 0 auto;
    }

    figure {
      margin: 0 0 clamp(16px, 3vw, 40px);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #282b33;
      border-radius: 12px;
      background: #111318;
      box-shadow: 0 16px 48px rgb(0 0 0 / 35%);
    }
  </style>
</head>
<body>
  <main aria-label="Shared screenshots">
    <figure><img src="00.png" alt="Terminal session screenshot" width="2940" height="1846"></figure>
    <figure><img src="01.png" alt="Rnet agent configuration screenshot" width="3296" height="3618" loading="lazy"></figure>
    <figure><img src="02.png" alt="Rnet run overview screenshot" width="3296" height="3618" loading="lazy"></figure>
    <figure><img src="03.png" alt="Rnet review timeline screenshot" width="3208" height="3530" loading="lazy"></figure>
    <figure><img src="04.png" alt="Rnet completed plan screenshot" width="3296" height="3618" loading="lazy"></figure>
  </main>
</body>
</html>
